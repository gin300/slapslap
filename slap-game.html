<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>扇巴掌游戏 👋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #F5E6D3 0%, #FFF8E7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            text-align: center;
            position: relative;
        }

        h1 {
            color: #8B4513;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
        }

        .game-area {
            position: relative;
            width: 400px;
            height: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .counter {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4757;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 2em;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255,71,87,0.4);
            z-index: 100;
        }

        .counter.hit {
            animation: counterPop 0.3s ease;
        }

        @keyframes counterPop {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.3); }
        }

        .image-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }

        #targetImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 1;
        }

        .red-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0);
            pointer-events: none;
            z-index: 2;
            transition: background 0.3s ease;
        }

        .upload-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 0;
        }

        .upload-area.hidden {
            display: none;
        }

        .upload-btn {
            background: #667eea;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-btn:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        #fileInput {
            display: none;
        }

        .hand {
            position: fixed;
            font-size: 80px;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

        .hand.slapping {
            animation: slapAnimation 0.2s ease;
        }

        @keyframes slapAnimation {
            0% { transform: translate(-50%, -50%) rotate(-30deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(10deg) scale(1.3); }
            100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
        }

        .shake {
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-10px, 0); }
            20%, 40%, 60%, 80% { transform: translate(10px, 0); }
        }

        .hit-effect {
            position: absolute;
            font-size: 3em;
            pointer-events: none;
            z-index: 50;
            animation: hitEffect 0.6s ease forwards;
        }

        @keyframes hitEffect {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(2) rotate(360deg);
            }
        }

        .controls {
            margin-top: 80px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            background: white;
            color: #667eea;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .instructions {
            color: #8B4513;
            margin-top: 20px;
            font-size: 1.1em;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }

        .dialogue-bubble {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 1.1em;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 150;
            animation: dialogueFade 2s ease forwards;
            max-width: 80%;
            text-align: center;
        }

        @keyframes dialogueFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            90% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        .settings-panel {
            position: fixed;
            right: -350px;
            top: 0;
            width: 350px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: -5px 0 20px rgba(0,0,0,0.3);
            transition: right 0.3s ease;
            z-index: 2000;
            overflow-y: auto;
            padding: 20px;
        }

        .settings-panel.open {
            right: 0;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .settings-header h2 {
            color: #333;
            font-size: 1.5em;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
        }

        .setting-group {
            margin-bottom: 25px;
        }

        .setting-group h3 {
            color: #555;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .setting-group label {
            display: block;
            color: #666;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .setting-group input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }

        .setting-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .dialogue-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin-top: 10px;
        }

        .dialogue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 5px;
            margin-bottom: 8px;
        }

        .dialogue-item span {
            flex: 1;
            color: #333;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .add-btn {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
                overflow-y: auto;
            }
            
            .container {
                width: 100%;
                padding: 0;
            }
            
            h1 {
                font-size: 1.5em;
                margin-bottom: 10px;
            }
            
            .game-area {
                width: 100%;
                max-width: 100%;
                height: 60vh;
                margin: 0 auto;
            }
            
            .counter {
                font-size: 1em;
                padding: 10px 20px;
                top: -50px;
                white-space: nowrap;
            }
            
            .controls {
                margin-top: 60px;
                flex-direction: column;
                gap: 10px;
                width: 100%;
            }
            
            .btn {
                width: 100%;
                padding: 15px 20px;
                font-size: 1.1em;
            }
            
            .hand {
                font-size: 60px;
            }
            
            .dialogue-bubble {
                font-size: 0.9em;
                padding: 10px 15px;
                max-width: 90%;
            }
            
            .instructions {
                font-size: 1em;
                margin-top: 15px;
            }
            
            .settings-panel {
                width: 90%;
                right: -90%;
            }
            
            .settings-panel.open {
                right: 5%;
            }
            
            .upload-area p {
                font-size: 1em !important;
            }
            
            .upload-btn {
                font-size: 1em;
                padding: 12px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 扇巴掌游戏</h1>
        
        <div class="game-area" id="gameArea">
            <div class="counter" id="counter">0</div>
            
            <div class="image-container">
                <div class="upload-area" id="uploadArea">
                    <p style="color: #666; margin-bottom: 15px; font-size: 1.1em;">上传一张图片开始游戏</p>
                    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                        📁 选择图片
                    </button>
                    <input type="file" id="fileInput" accept="image/*">
                </div>
                
                <img id="targetImage" style="display: none;">
                <div class="red-overlay" id="redOverlay"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="resetGame()">🔄 重置游戏</button>
            <button class="btn" onclick="document.getElementById('fileInput').click()">🖼️ 换图片</button>
            <button class="btn" onclick="toggleSettings()">⚙️ 设置</button>
        </div>

        <div class="instructions">
            💡 快速滑动鼠标或手指来扇巴掌！
        </div>
    </div>

    <div class="hand" id="hand">🖐️</div>

    <!-- 设置侧边栏 -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h2>⚙️ 设置</h2>
            <button class="close-btn" onclick="toggleSettings()">✕</button>
        </div>

        <div class="setting-group">
            <h3>💬 台词设置</h3>
            <label>触发频率: <span id="frequencyValue">30%</span></label>
            <input type="range" id="frequencySlider" min="0" max="100" value="30" oninput="updateFrequency(this.value)">
            
            <label style="margin-top: 15px;">台词列表:</label>
            <div class="dialogue-list" id="dialogueList"></div>
            
            <input type="text" id="newDialogue" placeholder="输入新台词..." style="margin-top: 10px;">
            <button class="add-btn" onclick="addDialogue()">➕ 添加台词</button>
        </div>
    </div>

    <script>
        // 游戏状态
        let slapCount = parseInt(localStorage.getItem('slapCount')) || 0;
        let redIntensity = 0;
        let lastX = 0;
        let lastY = 0;
        let lastTime = Date.now();
        let velocityX = 0;
        let velocityY = 0;
        const SLAP_THRESHOLD = 15; // 触发扇巴掌的速度阈值

        // 台词系统
        let dialogues = JSON.parse(localStorage.getItem('slapDialogues')) || ['本王可不是读女诫长大的'];
        let dialogueFrequency = parseFloat(localStorage.getItem('dialogueFrequency')) || 0.3; // 30%触发概率

        // 元素引用
        const hand = document.getElementById('hand');
        const gameArea = document.getElementById('gameArea');
        const counter = document.getElementById('counter');
        const redOverlay = document.getElementById('redOverlay');
        const targetImage = document.getElementById('targetImage');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        // 音效生成（使用Web Audio API）
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // 播放鞭打"啪啪"声
        function playWhipSound() {
            // 低频冲击声
            const osc1 = audioContext.createOscillator();
            const gain1 = audioContext.createGain();
            osc1.connect(gain1);
            gain1.connect(audioContext.destination);
            osc1.frequency.value = 80;
            osc1.type = 'sine';
            gain1.gain.setValueAtTime(0.4, audioContext.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.08);
            osc1.start(audioContext.currentTime);
            osc1.stop(audioContext.currentTime + 0.08);

            // 高频鞭打声
            const osc2 = audioContext.createOscillator();
            const gain2 = audioContext.createGain();
            osc2.connect(gain2);
            gain2.connect(audioContext.destination);
            osc2.frequency.value = 2000;
            osc2.type = 'square';
            gain2.gain.setValueAtTime(0.2, audioContext.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
            osc2.start(audioContext.currentTime);
            osc2.stop(audioContext.currentTime + 0.05);

            // 噪音效果（空气声）
            const noise = audioContext.createBufferSource();
            const bufferSize = audioContext.sampleRate * 0.1;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            noise.buffer = buffer;
            const noiseGain = audioContext.createGain();
            noiseGain.gain.setValueAtTime(0.3, audioContext.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            noise.connect(noiseGain);
            noiseGain.connect(audioContext.destination);
            noise.start(audioContext.currentTime);
        }

        // 播放"啊"的惨叫声
        function playScreamSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            // 随机音调的"啊"声
            const baseFreq = 400 + Math.random() * 200;
            osc.frequency.setValueAtTime(baseFreq, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.7, audioContext.currentTime + 0.3);
            
            osc.type = 'sawtooth';
            gain.gain.setValueAtTime(0.15, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.3);
        }

        // 综合音效播放
        function playSlapSound() {
            playWhipSound();
            // 50%概率播放惨叫声
            if (Math.random() > 0.5) {
                setTimeout(() => playScreamSound(), 50);
            }
        }

        // 图片上传处理
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    targetImage.src = event.target.result;
                    targetImage.style.display = 'block';
                    uploadArea.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // 鼠标/触摸移动处理
        function handleMove(x, y) {
            hand.style.left = x + 'px';
            hand.style.top = y + 'px';

            const currentTime = Date.now();
            const deltaTime = currentTime - lastTime;
            
            if (deltaTime > 0) {
                velocityX = Math.abs((x - lastX) / deltaTime) * 100;
                velocityY = Math.abs((y - lastY) / deltaTime) * 100;
                
                const totalVelocity = Math.sqrt(velocityX * velocityX + velocityY * velocityY);
                
                // 检测是否在游戏区域内且速度足够快
                const rect = gameArea.getBoundingClientRect();
                const isOverGameArea = x >= rect.left && x <= rect.right && 
                                      y >= rect.top && y <= rect.bottom;
                
                if (totalVelocity > SLAP_THRESHOLD && isOverGameArea && targetImage.style.display !== 'none') {
                    triggerSlap(x, y);
                }
            }
            
            lastX = x;
            lastY = y;
            lastTime = currentTime;
        }

        // 鼠标事件
        document.addEventListener('mousemove', function(e) {
            handleMove(e.clientX, e.clientY);
        });

        // 触摸事件
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
            const touch = e.touches[0];
            handleMove(touch.clientX, touch.clientY);
        }, { passive: false });

        // 显示台词气泡
        function showDialogue() {
            if (dialogues.length === 0 || Math.random() > dialogueFrequency) return;
            
            const randomDialogue = dialogues[Math.floor(Math.random() * dialogues.length)];
            const bubble = document.createElement('div');
            bubble.className = 'dialogue-bubble';
            bubble.textContent = randomDialogue;
            gameArea.appendChild(bubble);
            
            setTimeout(() => {
                bubble.remove();
            }, 2000);
        }

        // 触发扇巴掌效果
        function triggerSlap(x, y) {
            slapCount++;
            counter.textContent = `已被抽 ${slapCount} 次`;
            localStorage.setItem('slapCount', slapCount); // 保存计数
            counter.classList.add('hit');
            setTimeout(() => counter.classList.remove('hit'), 300);

            // 播放音效
            playSlapSound();

            // 手部动画
            hand.classList.add('slapping');
            setTimeout(() => hand.classList.remove('slapping'), 200);

            // 屏幕振动
            gameArea.classList.add('shake');
            setTimeout(() => gameArea.classList.remove('shake'), 300);

            // 增加红色效果
            redIntensity = Math.min(redIntensity + 0.08, 0.7);
            redOverlay.style.background = `rgba(255, 0, 0, ${redIntensity})`;

            // 创建打击特效
            createHitEffect(x, y);
            
            // 随机显示台词
            showDialogue();
        }

        // 创建打击特效
        function createHitEffect(x, y) {
            const effects = ['💥', '⭐', '✨', '💫', '🌟'];
            const randomEffect = effects[Math.floor(Math.random() * effects.length)];
            
            const effect = document.createElement('div');
            effect.className = 'hit-effect';
            effect.textContent = randomEffect;
            effect.style.left = x + 'px';
            effect.style.top = y + 'px';
            
            document.body.appendChild(effect);
            
            setTimeout(() => {
                effect.remove();
            }, 600);

            // 创建多个粒子效果
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'hit-effect';
                    particle.textContent = effects[Math.floor(Math.random() * effects.length)];
                    particle.style.left = (x + (Math.random() - 0.5) * 100) + 'px';
                    particle.style.top = (y + (Math.random() - 0.5) * 100) + 'px';
                    particle.style.fontSize = (Math.random() * 2 + 1) + 'em';
                    
                    document.body.appendChild(particle);
                    
                    setTimeout(() => particle.remove(), 600);
                }, i * 50);
            }
        }

        // 重置游戏
        function resetGame() {
            slapCount = 0;
            redIntensity = 0;
            counter.textContent = '已被抽 0 次';
            redOverlay.style.background = 'rgba(255, 0, 0, 0)';
            localStorage.setItem('slapCount', 0); // 保存重置后的计数
        }

        // 红色消散机制 - 每帧减少红色强度
        function fadeRedOverlay() {
            if (redIntensity > 0) {
                redIntensity = Math.max(0, redIntensity - 0.002); // 每帧减少
                redOverlay.style.background = `rgba(255, 0, 0, ${redIntensity})`;
            }
            requestAnimationFrame(fadeRedOverlay);
        }
        fadeRedOverlay(); // 启动消散循环

        // 设置面板功能
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                renderDialogueList();
            }
        }

        function updateFrequency(value) {
            dialogueFrequency = value / 100;
            document.getElementById('frequencyValue').textContent = value + '%';
            localStorage.setItem('dialogueFrequency', dialogueFrequency);
        }

        function renderDialogueList() {
            const list = document.getElementById('dialogueList');
            list.innerHTML = '';
            dialogues.forEach((dialogue, index) => {
                const item = document.createElement('div');
                item.className = 'dialogue-item';
                item.innerHTML = `
                    <span>${dialogue}</span>
                    <button class="delete-btn" onclick="deleteDialogue(${index})">删除</button>
                `;
                list.appendChild(item);
            });
        }

        function addDialogue() {
            const input = document.getElementById('newDialogue');
            const text = input.value.trim();
            if (text) {
                dialogues.push(text);
                localStorage.setItem('slapDialogues', JSON.stringify(dialogues));
                input.value = '';
                renderDialogueList();
            }
        }

        function deleteDialogue(index) {
            dialogues.splice(index, 1);
            localStorage.setItem('slapDialogues', JSON.stringify(dialogues));
            renderDialogueList();
        }

        // 初始化设置
        document.getElementById('frequencySlider').value = dialogueFrequency * 100;
        document.getElementById('frequencyValue').textContent = Math.round(dialogueFrequency * 100) + '%';

        // 初始化显示保存的计数
        counter.textContent = `已被抽 ${slapCount} 次`;

        // 初始化手的位置
        hand.style.left = window.innerWidth / 2 + 'px';
        hand.style.top = window.innerHeight / 2 + 'px';
    </script>
</body>
</html>
